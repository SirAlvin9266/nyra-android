<title>Nyra 3D Studio — Integrado</title>
<style>
:root{color-scheme:dark;--bg:#10131b;--panel:#191e2a;--line:#343e51;--text:#edf2fb;--muted:#aab5c8;--accent:#35e5ff}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:var(--bg);color:var(--text);font:14px system-ui,sans-serif}body{display:flex;flex-direction:column;min-height:100dvh}
header{padding:10px 14px;background:#151a25;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
h1{font-size:17px;margin:0}h1 span{color:var(--accent)}.sub{font-size:11px;color:var(--muted);margin-top:3px}
nav{display:flex;gap:6px;flex-wrap:wrap}button{border:1px solid var(--line);border-radius:8px;padding:9px 12px;background:#222a3a;color:var(--text);font:inherit;cursor:pointer}button.active{background:#12404a;border-color:#23899a;color:#e8fcff}
main{flex:1;min-height:0;padding:0}#editorHost{height:100%;min-height:450px}#editorHost iframe{display:block;width:100%;height:100%;min-height:450px;border:0;background:var(--bg)}
#message{padding:5px 12px;color:var(--muted);font-size:11px;border-top:1px solid var(--line)}
#setup{padding:7px 12px;background:#14202a;color:#b5c6d9;border-top:1px solid #263d50;font-size:11px}

#zoomControls{display:flex;align-items:center;gap:6px;flex-wrap:wrap;padding:5px 12px;background:#111722;border-top:1px solid #263044;color:var(--muted);font-size:12px}
#zoomControls button{padding:4px 9px;min-width:36px}
#nyraZoomValue{min-width:42px;text-align:center;font-variant-numeric:tabular-nums;color:var(--text)}
#nyraZoomRange{width:min(36vw,170px);accent-color:var(--accent)}
@media(max-width:600px){header{align-items:flex-start}h1{font-size:15px}nav{width:100%}nav button{flex:1;padding:8px 5px;font-size:12px}#editorHost iframe{min-height:600px}}
</style>
</head>

function decodePage(encoded){
 const binary=atob(encoded);
 const bytes=Uint8Array.from(binary,ch=>ch.charCodeAt(0));
 return new TextDecoder('utf-8').decode(bytes);
}

ers/OBJExporter.js';\nimport { STLExporter } from 'three/addons/exporters/STLExporter.js';\n\nlet editor = window.__nyraEditor;\nasync function waitForEditor(timeoutMs=12000){\n  const started=Date.now();\n  while(!editor && Date.now()-started<timeoutMs){\n    await new Promise(resolve=>setTimeout(resolve,100));\n    editor=window.__nyraEditor;\n  }\n  return editor;\n}\nconst status = document.getElementById('nyraModelStatus');\nconst input = document.getElementById('nyraModelFiles');\nconst importButton = document.getElementById('nyraImport3D');\nconst exportButtons = ['nyraExportGLB','nyraExportOBJ','nyraExportSTL'].map(id=>document.getElementById(id));\nconst treeWrap = document.getElementById('nyraModelTreeWrap');\nconst modelTree = document.getElementById('nyraModelTree');\nconst deleteNodeButton = document.getElementById('nyraDeleteNode');\nconst restoreNodeButton = document.getElementById('nyraRestoreNode');\nconst mathDslInput = document.getElementById('nyraMathDslInput');\nconst mathDslStatus = document.getElementById('nyraMathDslStatus');\nconst mathGenerateButton = document.getElementById('nyraGenerateMath');\nconst mathResetButton = document.getElementById('nyraResetMath');\nconst mathDraftKey = 'nyra.mathDsl.v1';\nlet importedModel = null;\nlet importedAnimations = [];\nlet selectedTreeNode = null;\nlet lastDeletedNode = null;\nlet resourceUrls = [];\nfunction setStatus(message){ if(status) status.textContent=message; const target=document.getElementById('status'); if(target) target.textContent=message; }\nfunction fileExtension(name){ return (name.split('.').pop()||'').toLowerCase(); }\nfunction disposeObject(object){\n  object.traverse(child=>{\n    if(child.geometry) child.geometry.dispose();\n    if(child.material){\n      const materials=Array.isArray(child.material)?child.material:[child.material];\n      for(const material of materials){\n        for(const value of Object.values(material)){\n          if(value && value.isTexture) value.dispose();\n        }\n        material.dispose();\n      }\n    }\n  });\n}\nfunction fitObject(object){\n  object.updateMatrixWorld(true);\n  const bounds=new THREE.Box3().setFromObject(object);\n  if(bounds.isEmpty()) throw new Error('O arquivo não contém geometria 3D visível.');\n  const center=bounds.getCenter(new THREE.Vector3());\n  const size=bounds.getSize(new THREE.Vector3());\n  const maxDimension=Math.max(size.x,size.y,size.z);\n  if(!Number.isFinite(maxDimension)||maxDimension<=0) throw new Error('O modelo possui dimensões inválidas.');\n  object.position.sub(center);\n  const factor=4.8/maxDimension;\n  object.scale.multiplyScalar(factor);\n  object.updateMatrixWorld(true);\n  const fitted=new THREE.Box3().setFromObject(object);\n  const fittedSize=fitted.getSize(new THREE.Vector3());\n  const radius=Math.max(fittedSize.x,fittedSize.y,fittedSize.z,1);\n  editor.controls.target.set(0,0,0);\n  editor.camera.position.set(radius*1.8,radius*1.35,radius*2.2);\n  editor.camera.near=Math.max(0.01,radius/1000);\n  editor.camera.far=Math.max(100,radius*30);\n  editor.camera.updateProjectionMatrix();\n  editor.controls.update();\n}\nfunction refreshModelTree(){\n  if(!modelTree)return;\n  modelTree.replaceChildren();\n  if(!importedModel){\n    if(treeWrap)treeWrap.style.display='none';\n    deleteNodeButton.disabled=true;\n    restoreNodeButton.disabled=!lastDeletedNode;\n    return;\n  }\n  if(treeWrap)treeWrap.style.display='block';\n  const appendNode=(object,depth)=>{\n    if(object.userData?.nyraInternal){\n      for(const child of object.children||[])appendNode(child,depth);\n      return;\n    }\n    const row=document.createElement('button');\n    row.type='button';\n    row.className='nyra-tree-node'+(selectedTreeNode===object?' active':'');\n    row.style.paddingLeft=(8+depth*14)+'px';\n    const label=object.name||object.type||'Objeto sem nome';\n    const kind=object.isMesh?' · malha':(object.isGroup?' · grupo':(object.isBone?' · osso':''));\n    row.textContent=label+kind;\n    row.title=label;\n    row.addEventListener('click',()=>{\n      selectedTreeNode=object;\n      editor.selectModel(object);\n      deleteNodeButton.disabled=false;\n      for(const child of modelTree.querySelectorAll('button'))child.classList.toggle('active',child===row);\n      setStatus('Componente selecionado: '+label+'. Use as ferramentas de mover, girar e redimensionar.');\n    });\n    modelTree.appendChild(row);\n    for(const child of object.children||[])appendNode(child,depth+1);\n  };\n  appendNode(importedModel,0);\n  deleteNodeButton.disabled=!importedModel;\n  restoreNodeButton.disabled=!lastDeletedNode;\n}\nfunction selectedComponent(){\n  return (editor&&typeof editor.getSelected==='function'&&editor.getSelected())||selectedTreeNode||importedModel;\n}\nfunction deleteSelectedComponent(){\n  const object=selectedComponent();\n  if(!object||!object.parent){setStatus('Selecione uma peça na hierarquia antes de excluir.');return;}\n  const parent=object.parent;\n  const index=parent.children.indexOf(object);\n  if(index<0)return;\n  if(lastDeletedNode&&lastDeletedNode.object!==object)disposeObject(lastDeletedNode.object);\n  lastDeletedNode={object,parent,index,wasRoot:object===importedModel,animations:importedAnimations.slice()};\n  parent.remove(object);\n  if(lastDeletedNode.wasRoot){\n    importedModel=null;\n    importedAnimations=[];\n    selectedTreeNode=null;\n    exportButtons.forEach(button=>button.disabled=true);\n    editor.transform.detach();\n  }else{\n    selectedTreeNode=null;\n    editor.transform.detach();\n  }\n  editor.scene.updateMatrixWorld(true);\n  refreshModelTree();\n  setStatus('Peça excluída. Use “Restaurar última exclusão” para recuperá-la com sua hierarquia e transformações.');\n}\nfunction restoreLastDeleted(){\n  if(!lastDeletedNode){setStatus('Não há nenhuma exclusão recente para restaurar.');return;}\n  const saved=lastDeletedNode;\n  if(!saved.parent){setStatus('O modelo original não está mais disponível para restauração.');return;}\n  saved.parent.add(saved.object);\n  const currentIndex=saved.parent.children.indexOf(saved.object);\n  saved.parent.children.splice(currentIndex,1);\n  saved.parent.children.splice(Math.min(saved.index,saved.parent.children.length),0,saved.object);\n  if(saved.wasRoot){\n    importedModel=saved.object;\n    importedAnimations=saved.animations;\n    exportButtons.forEach(button=>button.disabled=false);\n  }\n  lastDeletedNode=null;\n  selectedTreeNode=saved.object;\n  editor.scene.updateMatrixWorld(true);\n  editor.selectModel(saved.object);\n  refreshModelTree();\n  setStatus('Peça restaurada com hierarquia e transformações preservadas.');\n}\ndeleteNodeButton.addEventListener('click',deleteSelectedComponent);\nrestoreNodeButton.addEventListener('click',restoreLastDeleted);\n\nconst mathExample = {\n  version: 1,\n  name: 'Nyra — robô geométrico',\n  components: [\n    { id: 'body', type: 'group', name: 'Corpo', position: [0, 0, 0], pivot: [0, 0, 0] },\n    { id: 'torso', type: 'box', name: 'Torso', parent: 'body', size: [1.1, 1.35, 0.55], position: [0, 1.45, 0], color: '#536b83' },\n    { id: 'head', type: 'sphere', name: 'Cabeça', parent: 'body', radius: 0.43, position: [0, 2.42, 0], color: '#a9c2d8' },\n    { id: 'eyeL', type: 'sphere', name: 'Olho esquerdo', parent: 'head', radius: 0.075, position: [-0.16, 0.02, 0.36], color: '#70e1ff' },\n    { id: 'eyeR', type: 'sphere', name: 'Olho direito', parent: 'head', radius: 0.075, position: [0.16, 0.02, 0.36], color: '#70e1ff' },\n    { id: 'leftArm', type: 'cylinder', name: 'Braço esquerdo', parent: 'body', radiusTop: 0.13, radiusBottom: 0.16, height: 0.95, position: [-0.72, 1.42, 0], rotation: [0, 0, 0.18], pivot: [0, 0.38, 0], color: '#879caf' },\n    { id: 'rightArm', type: 'cylinder', name: 'Braço direito', parent: 'body', radiusTop: 0.13, radiusBottom: 0.16, height: 0.95, position: [0.72, 1.42, 0], rotation: [0, 0, -0.18], pivot: [0, 0.38, 0], color: '#879caf' },\n    { id: 'leftLeg', type: 'box', name: 'Perna esquerda', parent: 'body', size: [0.32, 0.85, 0.38], position: [-0.28, 0.35, 0], color: '#394e63' },\n    { id: 'rightLeg', type: 'box', name: 'Perna direita', parent: 'body', size: [0.32, 0.85, 0.38], position: [0.28, 0.35, 0], color: '#394e63' }\n  ]\n};\nfunction mathVector(value,fallback,label,id){\n  if(value===undefined||value===null)return fallback.slice();\n  if(!Array.isArray(value)||value.length!==3||!value.every(n=>Number.isFinite(Number(n))))throw new Error('Componente '+id+': '+label+' deve ter três números finitos.');\n  return value.map(Number);\n}\nfunction mathPositive(value,fallback,label,id){\n  const number=value===undefined?fallback:Number(value);\n  if(!Number.isFinite(number)||number<=0)throw new Error('Componente '+id+': '+label+' deve ser maior que zero.');\n  return number;\n}\nfunction validateMathDocument(documentData){\n  if(!documentData||typeof documentData!=='object'||Array.isArray(documentData))throw new Error('O documento deve ser um objeto JSON.');\n  if(documentData.version!==1)throw new Error('Versão de DSL não suportada. Use version: 1.');\n  if(!Array.isArray(documentData.components)||documentData.components.length<1)throw new Error('Adicione pelo menos um componente.');\n  if(documentData.components.length>500)throw new Error('O limite atual é de 500 componentes por modelo.');\n  const ids=new Map();\n  for(const item of documentData.components){\n    if(!item||typeof item!=='object'||Array.isArray(item))throw new Error('Há um componente com estrutura inválida.');\n    const id=String(item.id||'').trim();\n    if(!id)throw new Error('Todo componente precisa de um id.');\n    if(ids.has(id))throw new Error('Id duplicado: '+id+'.');\n    if(!['group','box','sphere','cylinder','cone'].includes(item.type))throw new Error('Tipo não suportado em '+id+': '+item.type+'.');\n    if(!String(item.name||'').trim())throw new Error('Componente '+id+': informe um nome.');\n    if(item.parent!==undefined&&item.parent!==null&&String(item.parent).trim()==='')throw new Error('Componente '+id+': parent não pode ser vazio.');\n    const position=mathVector(item.position,[0,0,0],'position',id);\n    const rotation=mathVector(item.rotation,[0,0,0],'rotation',id);\n    const scale=mathVector(item.scale,[1,1,1],'scale',id);\n    const pivot=mathVector(item.pivot,[0,0,0],'pivot',id);\n    if(scale.some(n=>n<=0))throw new Error('Componente '+id+': scale deve conter valores positivos.');\n    if(item.color!==undefined&&!/^#[0-9a-f]{6}$/i.test(String(item.color)))throw new Error('Componente '+id+': color deve usar #RRGGBB.');\n    const normalized={...item,id,name:String(item.name).trim(),position,rotation,scale,pivot};\n    if(item.type==='box'){\n      normalized.size=mathVector(item.size,[1,1,1],'size',id);\n      if(normalized.size.some(n=>n<=0))throw new Error('Componente '+id+': size deve conter valores positivos.');\n    }\n    if(item.type==='sphere')normalized.radius=mathPositive(item.radius,0.5,'radius',id);\n    if(item.type==='cylinder'||item.type==='cone'){\n      normalized.height=mathPositive(item.height,1,'height',id);\n      normalized.radiusTop=item.type==='cone'?0:mathPositive(item.radiusTop,0.5,'radiusTop',id);\n      normalized.radiusBottom=mathPositive(item.radiusBottom,0.5,'radiusBottom',id);\n    }\n    normalized.segments=Math.max(8,Math.min(64,Math.floor(mathPositive(item.segments,24,'segments',id))));\n    ids.set(id,normalized);\n  }\n  for(const item of ids.values()){\n    if(item.parent!==undefined&&item.parent!==null){\n      const parent=ids.get(String(item.parent));\n      if(!parent)throw new Error('Componente '+item.id+': parent inexistente '+item.parent+'.');\n      if(parent.id===item.id)throw new Error('Componente '+item.id+': não pode ser pai de si mesmo.');\n    }\n    const visited=new Set([item.id]);\n    let parent=item.parent===undefined||item.parent===null?null:ids.get(String(item.parent));\n    while(parent){\n      if(visited.has(parent.id))throw new Error('Ciclo detectado na hierarquia em '+item.id+'.');\n      visited.add(parent.id);\n      parent=parent.parent===undefined||parent.parent===null?null:ids.get(String(parent.parent));\n    }\n  }\n  return {name:String(documentData.name||'Modelo matemático'),components:[...ids.values()]};\n}\nfunction geometryForMathComponent(component){\n  if(component.type==='box')return new THREE.BoxGeometry(...component.size);\n  if(component.type==='sphere')return new THREE.SphereGeometry(component.radius,component.segments,Math.max(6,Math.floor(component.segments*0.66)));\n  if(component.type==='cylinder')return new THREE.CylinderGeometry(component.radiusTop,component.radiusBottom,component.height,component.segments);\n  if(component.type==='cone')return new THREE.ConeGeometry(component.radiusBottom,component.height,component.segments);\n  return null;\n}\nfunction buildMathModel(documentData){\n  const spec=validateMathDocument(documentData);\n  const root=new THREE.Group();\n  root.name=spec.name;\n  root.userData.nyraMathematicalModel=true;\n  const nodes=new Map();\n  const contentGroups=new Map();\n  try{\n    for(const item of spec.components){\n      const wrapper=new THREE.Group();\n      wrapper.name=item.name;\n      wrapper.userData.nyraDslId=item.id;\n      wrapper.userData.nyraDslType=item.type;\n      wrapper.userData.nyraPivot=item.pivot.slice();\n      wrapper.position.set(item.position[0]+item.pivot[0],item.position[1]+item.pivot[1],item.position[2]+item.pivot[2]);\n      wrapper.rotation.set(...item.rotation);\n      wrapper.scale.set(...item.scale);\n      const content=new THREE.Group();\n      content.name='__nyraPivotContent';\n      content.userData.nyraInternal=true;\n      content.position.set(-item.pivot[0],-item.pivot[1],-item.pivot[2]);\n      wrapper.add(content);\n      const geometry=geometryForMathComponent(item);\n      if(geometry){\n        const mesh=new THREE.Mesh(geometry,new THREE.MeshStandardMaterial({color:item.color||'#a9c2d8',roughness:0.72,metalness:0.08}));\n        mesh.name='__nyraGeneratedGeometry';\n        mesh.userData.nyraInternal=true;\n        mesh.castShadow=true;\n        mesh.receiveShadow=true;\n        content.add(mesh);\n      }\n      nodes.set(item.id,wrapper);\n      contentGroups.set(item.id,content);\n    }\n    for(const item of spec.components){\n      const parent=item.parent===undefined||item.parent===null?root:contentGroups.get(String(item.parent));\n      parent.add(nodes.get(item.id));\n    }\n    root.updateMatrixWorld(true);\n    const bounds=new THREE.Box3().setFromObject(root);\n    if(bounds.isEmpty())throw new Error('O documento só contém grupos vazios e não gera geometria visível.');\n    return root;\n  }catch(error){disposeObject(root);throw error;}\n}\nfunction showMathStatus(message,isError=false){\n  if(mathDslStatus){mathDslStatus.textContent=message;mathDslStatus.style.color=isError?'#ffadad':'#aabbd0';}\n  setStatus(message);\n}\nfunction generateMathModel(){\n  try{\n    const parsed=JSON.parse(mathDslInput.value);\n    const model=buildMathModel(parsed);\n    addModel(model,model.name,[]);\n    try{localStorage.setItem(mathDraftKey,mathDslInput.value);}catch(error){console.warn('Nyra DSL draft could not be stored',error);}\n    showMathStatus('Modelo validado e gerado: '+model.name+'. '+parsed.components.length+' componentes editáveis foram organizados na hierarquia.');\n  }catch(error){\n    console.error('Nyra mathematical model generation failed',error);\n    showMathStatus('Não foi possível gerar o modelo: '+(error&&error.message?error.message:String(error)),true);\n  }\n}\nif(mathDslInput){\n  try{mathDslInput.value=localStorage.getItem(mathDraftKey)||JSON.stringify(mathExample,null,2);}catch(error){mathDslInput.value=JSON.stringify(mathExample,null,2);}\n  mathDslInput.addEventListener('input',()=>{try{localStorage.setItem(mathDraftKey,mathDslInput.value);}catch(error){}});\n  mathGenerateButton.addEventListener('click',generateMathModel);\n  mathResetButton.addEventListener('click',()=>{mathDslInput.value=JSON.stringify(mathExample,null,2);try{localStorage.setItem(mathDraftKey,mathDslInput.value);}catch(error){}showMathStatus('Exemplo carregado. Revise as instruções e toque em Validar e gerar modelo.');});\n}\nfunction addModel(object,name,animations=[]){\n  if(lastDeletedNode){disposeObject(lastDeletedNode.object);lastDeletedNode=null;}\n  if(importedModel){editor.transform.detach();editor.scene.remove(importedModel);disposeObject(importedModel);}\n  importedModel=object;\n  importedModel.name=name.replace(/\\\\.[^.]+$/,'')||'Modelo importado';\n  importedAnimations=Array.isArray(animations)?animations:[];\n  selectedTreeNode=importedModel;\n  fitObject(importedModel);\n  editor.scene.add(importedModel);\n  editor.selectModel(importedModel);\n  editor.scene.updateMatrixWorld(true);\n  exportButtons.forEach(button=>button.disabled=false);\n  refreshModelTree();\n  setStatus('Modelo carregado: '+name+'. A hierarquia pode ser editada por peça; materiais, UVs e animações compatíveis são preservados.'+(importedAnimations.length?' Animações: '+importedAnimations.length+'.':'')+(importedModel.userData?.bbImportedCubes!==undefined?' Elementos Blockbench: '+importedModel.userData.bbImportedCubes+' cubos e '+importedModel.userData.bbImportedMeshes+' malhas.':'')+(importedModel.userData?.bbModelWarnings?.length?' Avisos: '+importedModel.userData.bbModelWarnings.join(' '):''));\n}\nfunction makeManager(files){\n  const manager=new THREE.LoadingManager();\n  const urlMap=new Map();\n  for(const file of files){\n    const url=URL.createObjectURL(file);\n    resourceUrls.push(url);\n    urlMap.set(file.name,url);\n    if(file.webkitRelativePath) urlMap.set(file.webkitRelativePath,url);\n  }\n  manager.setURLModifier(url=>{\n    const clean=decodeURIComponent(url.split(/[?#]/)[0]);\n    if(urlMap.has(clean)) return urlMap.get(clean);\n    const basename=clean.split('/').pop();\n    if(urlMap.has(basename)) return urlMap.get(basename);\n    return url;\n  });\n  return manager;\n}\n\nfunction bbCoordinate(v,scale=16){return Array.isArray(v)?v.slice(0,3).map(n=>Number(n||0)/scale):[0,0,0]}\nfunction bbEuler(v){return (Array.isArray(v)?v:[0,0,0]).slice(0,3).map(n=>THREE.MathUtils.degToRad(Number(n)||0))}\nasync function parseBBModel(file){\n const data=JSON.parse(await file.text());\n if(!data||!Array.isArray(data.elements))throw new Error('O arquivo .bbmodel não contém elementos válidos.');\n const resolution={width:Number(data.resolution?.width)||16,height:Number(data.resolution?.height)||16};\n const textureDefs=Array.isArray(data.textures)?data.textures:[];\n const textureEntries=await Promise.all(textureDefs.map(async def=>{\n  const source=[def.source,def.path].find(v=>typeof v==='string'&&v.startsWith('data:image/'));\n  if(!source)return {def,texture:null};\n  const texture=await new Promise((resolve,reject)=>new THREE.TextureLoader().load(source,resolve,undefined,reject));\n  texture.colorSpace=THREE.SRGBColorSpace;texture.flipY=true;texture.magFilter=THREE.NearestFilter;texture.minFilter=THREE.NearestFilter;texture.generateMipmaps=false;\n  return {def,texture};\n }));\n const materials=[new THREE.MeshStandardMaterial({color:0xd5e2ed,roughness:.82,side:THREE.DoubleSide})],materialIndices=new Map([[-1,0]]);\n function materialIndex(ref){\n  let index=-1;\n  if(ref===undefined||ref===null||ref===-1)index=textureEntries.length===1?0:-1;\n  else if(typeof ref==='number'&&Number.isInteger(ref))index=ref;\n  else{index=textureEntries.findIndex(x=>String(x.def.uuid||'')===String(ref)||String(x.def.id||'')===String(ref));if(index<0&&/^\\d+$/.test(String(ref)))index=Number(ref);}\n  if(index<0||index>=textureEntries.length||!textureEntries[index].texture)return 0;\n  if(materialIndices.has(index))return materialIndices.get(index);\n  const material=new THREE.MeshStandardMaterial({map:textureEntries[index].texture,color:0xffffff,roughness:.82,side:THREE.DoubleSide});\n  const next=materials.length;materials.push(material);materialIndices.set(index,next);return next;\n }\n const root=new THREE.Group();root.name=data.name||file.name.replace(/\\.bbmodel$/i,'')||'Modelo Blockbench';\n root.userData.nyraBBModel=true;root.userData.bbModelFormat=data.meta?.model_format||'unknown';\n const groupDefs=new Map((data.groups||[]).filter(g=>g?.uuid).map(g=>[g.uuid,g]));\n const groupNodes=new Map(),pivotNodes=new Map(),elementDefs=new Map((data.elements||[]).filter(e=>e?.uuid).map(e=>[e.uuid,e]));\n for(const [id,g] of groupDefs){const node=new THREE.Group();node.name=g.name||'Grupo';node.userData.bbGroupUuid=id;node.visible=g.visibility!==false;groupNodes.set(id,node);}\n const built=new Set();let cubeCount=0,meshCount=0;\n function buildElement(el,parent,parentOrigin){\n  if(!el||built.has(el.uuid))return;\n  const origin=bbCoordinate(el.origin,16),pivot=new THREE.Group();\n  pivot.name=(el.name||'Componente')+' · pivô';pivot.userData.bbPivot=true;pivot.position.set(...origin.map((n,i)=>n-parentOrigin[i]));pivot.rotation.set(...bbEuler(el.rotation));parent.add(pivot);\n  let geometry,position=[0,0,0];\n  if((!el.type||el.type==='cube')&&Array.isArray(el.from)&&Array.isArray(el.to)){\n   const from=bbCoordinate(el.from,16),to=bbCoordinate(el.to,16),size=from.map((n,i)=>Math.abs(to[i]-n));\n   if(size.some(n=>!Number.isFinite(n)||n<=0)){parent.remove(pivot);return;}\n   const center=from.map((n,i)=>(n+to[i])/2);position=center.map((n,i)=>n-origin[i]);geometry=new THREE.BoxGeometry(...size);\n   const uv=geometry.attributes.uv,w=resolution.width,h=resolution.height,faceNames=['east','west','up','down','south','north'];\n   for(let f=0;f<6;f++){const face=el.faces?.[faceNames[f]];if(face?.uv?.length>=4){const [u1,v1,u2,v2]=face.uv.map(Number),corners=[[u1,v2],[u2,v2],[u1,v1],[u2,v1]],turn=((Number(face.rotation)||0)/90%4+4)%4;for(let i=0;i<4;i++){const p=corners[(i-turn+4)%4];uv.setXY(f*4+i,p[0]/w,1-p[1]/h);}}}\n   uv.needsUpdate=true;geometry.clearGroups();for(let f=0;f<6;f++)geometry.addGroup(f*6,6,materialIndex(el.faces?.[faceNames[f]]?.texture));cubeCount++;\n  }else if(el.type==='mesh'&&el.vertices&&el.faces){\n   const pos=[],uvs=[];geometry=new THREE.BufferGeometry();\n   for(const face of Object.values(el.faces)){const ids=Array.isArray(face.vertices)?face.vertices:[];if(ids.length<3)continue;const start=pos.length/3,mat=materialIndex(face.texture);\n    for(let t=1;t<ids.length-1;t++)for(const id of [ids[0],ids[t],ids[t+1]]){const v=el.vertices[id];if(!Array.isArray(v)||v.length<3)throw new Error('Malha '+(el.name||'')+' contém referência a vértice inválida.');const p=bbCoordinate(v,16),uv=face.uv?.[id];pos.push(p[0]-origin[0],p[1]-origin[1],p[2]-origin[2]);if(Array.isArray(uv)&&uv.length>=2)uvs.push(Number(uv[0])/resolution.width,1-Number(uv[1])/resolution.height);else uvs.push(0,0);}\n    if(pos.length/3>start)geometry.addGroup(start,pos.length/3-start,mat);\n   }\n   if(!pos.length){parent.remove(pivot);return;}geometry.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));geometry.setAttribute('uv',new THREE.Float32BufferAttribute(uvs,2));geometry.computeVertexNormals();meshCount++;\n  }else{parent.remove(pivot);return;}\n  const mesh=new THREE.Mesh(geometry,materials.length===1?materials[0]:materials);mesh.name=el.name||'Peça Blockbench';mesh.position.set(...position);\n  mesh.castShadow=el.cast_shadow!==false;mesh.receiveShadow=el.receive_shadow!==false;mesh.userData.isBBModel=true;mesh.userData.bbUuid=el.uuid||'';mesh.userData.bbElementType=el.type||'cube';\n  pivot.add(mesh);pivotNodes.set(el.uuid,pivot);built.add(el.uuid);\n }\n const seenGroups=new Set();\n function walk(item,parent,parentOrigin){\n  if(typeof item==='string'){const el=elementDefs.get(item);if(el)buildElement(el,parent,parentOrigin);return;}\n  if(!item||typeof item!=='object'||!item.uuid||seenGroups.has(item.uuid))return;\n  const def=groupDefs.get(item.uuid)||item;let node=groupNodes.get(item.uuid);\n  if(!node){node=new THREE.Group();node.name=def.name||'Grupo';node.userData.bbGroupUuid=item.uuid;groupNodes.set(item.uuid,node);}\n  seenGroups.add(item.uuid);const origin=bbCoordinate(def.origin,16);node.position.set(...origin.map((n,i)=>n-parentOrigin[i]));node.rotation.set(...bbEuler(def.rotation));node.visible=def.visibility!==false;parent.add(node);\n  for(const child of item.children||[])walk(child,node,origin);\n }\n for(const item of data.outliner||[])walk(item,root,[0,0,0]);\n for(const element of data.elements)if(!built.has(element.uuid))buildElement(element,root,[0,0,0]);\n root.updateMatrixWorld(true);if(new THREE.Box3().setFromObject(root).isEmpty())throw new Error('Nenhum cubo ou malha compatível foi encontrado no .bbmodel.');\n const animations=[];\n for(const anim of data.animations||[]){const tracks=[];let duration=Number(anim.length)||0;\n  for(const [id,animator] of Object.entries(anim.animators||{})){const target=groupNodes.get(id)||pivotNodes.get(id);if(!target)continue;const byChannel=new Map();\n   for(const frame of animator.keyframes||[]){const channel=frame.channel,point=frame.data_points?.[0],time=Number(frame.time);if(!point||!['rotation','position','scale'].includes(channel)||!Number.isFinite(time))continue;const values=['x','y','z'].map(k=>Number(point[k]??0));if(!values.every(Number.isFinite))continue;duration=Math.max(duration,time);if(!byChannel.has(channel))byChannel.set(channel,[]);byChannel.get(channel).push({time,values,interpolation:frame.interpolation});}\n   for(const [channel,rawFrames] of byChannel){const frames=rawFrames.sort((a,b)=>a.time-b.time).filter((f,i,a)=>i===0||f.time>a[i-1].time);if(!frames.length)continue;const times=frames.map(f=>f.time);let track;\n    if(channel==='rotation'){const values=[];for(const f of frames){const e=new THREE.Euler(...f.values.map(v=>THREE.MathUtils.degToRad(v)),'XYZ'),q=new THREE.Quaternion().setFromEuler(e);values.push(q.x,q.y,q.z,q.w);}track=new THREE.QuaternionKeyframeTrack(target.uuid+'.quaternion',times,values);}\n    else{const values=frames.flatMap(f=>channel==='position'?f.values.map(v=>v/16):f.values);track=new THREE.VectorKeyframeTrack(target.uuid+'.'+channel,times,values);}\n    if(frames[0].interpolation==='step')track.setInterpolation(THREE.InterpolateDiscrete);tracks.push(track);\n   }\n  }\n  if(tracks.length)animations.push(new THREE.AnimationClip(anim.name||'Blockbench animation',duration,tracks));\n }\n root.userData.bbImportedCubes=cubeCount;root.userData.bbImportedMeshes=meshCount;root.userData.bbModelAnimationCount=(data.animations||[]).length;\n return {object:root,animations};\n}\n\nasync function parseModel(modelFile,files){\n  const extension=fileExtension(modelFile.name);\n  if(extension==='bbmodel')return await parseBBModel(modelFile);\n  const manager=makeManager(files);\n  if(extension==='glb'||extension==='gltf'){\n    const loader=new GLTFLoader(manager);\n    const buffer=await modelFile.arrayBuffer();\n    return await new Promise((resolve,reject)=>{\n      loader.parse(buffer,'',result=>resolve({object:result.scene,animations:result.animations||[]}),reject);\n    });\n  }\n  if(extension==='obj'){\n    return {object:new OBJLoader(manager).parse(await modelFile.text()),animations:[]};\n  }\n  if(extension==='fbx'){\n    const object=new FBXLoader(manager).parse(await modelFile.arrayBuffer(),'');\n    return {object,animations:Array.isArray(object.animations)?object.animations:[]};\n  }\n  if(extension==='stl'){\n    const geometry=new STLLoader(manager).parse(await modelFile.arrayBuffer());\n    geometry.computeVertexNormals();\n    return {object:new THREE.Mesh(geometry,new THREE.MeshStandardMaterial({color:0xb8c7d9,metalness:.15,roughness:.72})),animations:[]};\n  }\n  throw new Error('Formato não suportado: .'+extension);\n}\nfunction saveBlob(blob,filename){\n  const url=URL.createObjectURL(blob);\n  const anchor=document.createElement('a');\n  anchor.href=url;anchor.download=filename;anchor.style.display='none';\n  document.body.appendChild(anchor);anchor.click();anchor.remove();\n  setTimeout(()=>URL.revokeObjectURL(url),60000);\n}\nasync function loadSelectedFiles(){\n  const files=Array.from(input.files||[]);\n  const modelFile=files.find(file=>['glb','gltf','obj','fbx','stl','bbmodel'].includes(fileExtension(file.name)));\n  if(!modelFile){setStatus('Selecione um arquivo GLB, glTF, OBJ, FBX, STL ou BBModel.');return;}\n  exportButtons.forEach(button=>button.disabled=true);\n  importButton.disabled=true;\n  const sizeMiB=modelFile.size/1048576;\n  const largeModelWarning=sizeMiB>=32?' Modelo grande ('+sizeMiB.toFixed(1)+' MiB): o processamento pode consumir bastante memória no Android.':'';\n  setStatus('Lendo '+modelFile.name+' ('+sizeMiB.toFixed(1)+' MB)…'+largeModelWarning);\n  try{\n    const parsed=await parseModel(modelFile,files);\n    addModel(parsed.object,modelFile.name,parsed.animations);\n    for(const url of resourceUrls) URL.revokeObjectURL(url);\n    resourceUrls=[];\n  }catch(error){\n    console.error('Nyra model import failed',error);\n    setStatus('Falha ao importar '+modelFile.name+': '+(error&&error.message?error.message:String(error)));\n    exportButtons.forEach(button=>button.disabled=!importedModel);\n    for(const url of resourceUrls) URL.revokeObjectURL(url);\n    resourceUrls=[];\n  }finally{\n    importButton.disabled=false;\n    input.value='';\n  }\n}\nimportButton.addEventListener('click',()=>input.click());\ninput.addEventListener('change',loadSelectedFiles);\nfunction currentModel(){if(!importedModel)throw new Error('Importe um modelo antes de exportar.');return importedModel;}\ndocument.getElementById('nyraExportGLB').addEventListener('click',()=>{\n  try{\n    const exporter=new GLTFExporter();\n    exporter.parse(currentModel(),result=>{\n      const blob=new Blob([result],{type:'model/gltf-binary'});\n      saveBlob(blob,'nyra-modelo.glb');\n      setStatus('GLB exportado. Materiais, texturas e '+importedAnimations.length+' clip(s   const panelEnd = '</div></section></main>';
  if (html.toLowerCase().includes(panelEnd)) {
    html = html.replace(panelEnd, modelTools + panelEnd);

 }

 if(key==='animation'){
  const persistence = '\n/* Nyra Android: automatic local draft, preserving the existing project JSON format. */\n'
   +'const nyraAnimationDraftKey="nyra3d-robotv-project";let nyraAnimationDraftTimer=null;'
   +'function nyraSaveAnimationDraft(){try{localStorage.setItem(nyraAnimationDraftKey,JSON.stringify(projectData()));}catch(e){status("Não foi possível salvar o rascunho automaticamente. Use Exportar JSON.");}}'
   +'function nyraScheduleAnimationDraft(){if(nyraAnimationDraftTimer)clearTimeout(nyraAnimationDraftTimer);nyraAnimationDraftTimer=setTimeout(nyraSaveAnimationDraft,300);}'
   +'document.addEventListener("input",function(e){if(e.target&&["rx","ry","rz","speed","joint"].includes(e.target.id))nyraScheduleAnimationDraft();},true);'
   +'document.addEventListener("change",function(e){if(e.target&&["joint","fileInput","speed"].includes(e.target.id))nyraScheduleAnimationDraft();},true);'
   +'document.addEventListener("click",function(e){if(e.target&&e.target.closest&&e.target.closest("button"))nyraScheduleAnimationDraft();},true);'
   +'viewport.addEventListener("pointerup",nyraScheduleAnimationDraft,true);';
  html=html.replace(/<\/script>\s*<\/body>/i,persistence+'<'+'/script></body>');
 }

 const bridgeScript = '<script>(function(){'
  +'const bridge=window.NyraAndroid||window.parent.NyraAndroid;'
  +'if(!bridge)return;'
  +'const pending=new WeakSet();'
  +'async function saveAnchor(a){'
  +'if(!a||!a.hasAttribute("download")||pending.has(a))return;'
  +'const href=a.href||a.getAttribute("href")||"";if(!/^(blob:|data:)/i.test(href))return;'
  +'pending.add(a);let token="";'
  +'try{'
  +'const response=await fetch(href);if(!response.ok)throw new Error("Não foi possível ler o arquivo exportado.");'
  +'const blob=await response.blob();'
  +'token=bridge.beginExport(a.download||"nyra-export.bin",blob.type||"application/octet-stream");'
  +'if(!token)throw new Error("O Android não conseguiu preparar o arquivo.");'
  +'const chunkSize=48*1024;'
  +'for(let offset=0;offset<blob.size;offset+=chunkSize){'
  +'const bytes=new Uint8Array(await blob.slice(offset,offset+chunkSize).arrayBuffer());'
  +'let binary="";for(let i=0;i<bytes.length;i++)binary+=String.fromCharCode(bytes[i]);'
  +'if(!bridge.appendExportChunk(token,btoa(binary)))throw new Error("Falha ao gravar parte do arquivo.");'
  +'}'
  +'if(!bridge.finishExport(token))throw new Error("Não foi possível abrir o seletor de salvamento.");'
  +'token="";'
  +'}catch(err){if(token&&bridge.cancelExport)bridge.cancelExport(token);alert("Falha na exportação: "+(err&&err.message?err.message:String(err)));}'
  +'finally{pending.delete(a);}'
  +'}'
  +'const originalAnchorClick=HTMLAnchorElement.prototype.click;'
  +'HTMLAnchorElement.prototype.click=function(){'
  +'if(this.hasAttribute("download")&&/^(blob:|data:)/i.test(this.href)){saveAnchor(this);return;}'
  +'return originalAnchorClick.apply(this,arguments);'
  +'};'
  +'document.addEventListener("click",function(ev){'
  +'const a=ev.target&&ev.target.closest?ev.target.closest("a[download]"):null;'
  +'if(!a)return;const href=a.href||a.getAttribute("href")||"";'
  +'if(!/^(blob:|data:)/i.test(href))return;'
  +'ev.preventDefault();ev.stopImmediatePropagation();saveAnchor(a);'
  +'},true);'
  +'})();'+'<'+'/script>';
 if(/<\/body>/i.test(html)) return html.replace(/<\/body>/i,bridgeScript+'</body>');
 return html.replace(/<\/html>/i,bridgeScript+'</html>');
}
function ensureEditor(key){
 if(editorFrames[key])return editorFrames[key];
 const frame=document.createElement('iframe');
 frame.title=names[key];
 frame.setAttribute('allow','clipboard-read; clipboard-write');
 frame.dataset.editor=key;
 frame.style.cssText='display:none;width:100%;height:100%;min-height:450px;border:0;background:var(--bg)';
 frame.srcdoc=addAndroidExportAdapter(decodePage(pages[key]),key);
 host.appendChild(frame);
 editorFrames[key]=frame;
 applyEditorZoom(zoomRange.value);
 return frame;
}

const zoomRange=document.getElementById('nyraZoomRange');
const zoomValue=document.getElementById('nyraZoomValue');
function applyEditorZoom(value){
 // Wide logical iframe viewport + CSS zoom reproduces a desktop-sized editor.
 // Desktop canvas preference is separate from the compact base scale.
 const desktopMode=(()=>{try{return localStorage.getItem('nyra_desktop_canvas')==='1'}catch(_){return false}})();
 const zoom=Math.max(40,Math.min(150,Number(value)||100));
 zoomRange.value=String(zoom);zoomValue.textContent=zoom+'%';
 Object.values(editorFrames).forEach(frame=>{
   const effectiveZoom=desktopMode?Math.min(100,zoom):zoom;
   frame.style.zoom=String(effectiveZoom/100);
   frame.style.width=(10000/effectiveZoom)+'%';
   frame.style.height=(10000/effectiveZoom)+'%';
 });
 try{localStorage.setItem('nyra_ui_zoom',String(zoom))}catch(_){}
}
const desktopToggle=document.createElement('button');
desktopToggle.id='nyraDesktopCanvasToggle';
desktopToggle.type='button';
const desktopMode=(()=>{try{return localStorage.getItem('nyra_desktop_canvas')==='1'}catch(_){return false}})();
desktopToggle.setAttribute('aria-pressed',desktopMode?'true':'false');
desktopToggle.textContent=desktopMode?'Canvas desktop: ligado':'Canvas desktop: desligado';
desktopToggle.style.marginLeft='auto';
desktopToggle.addEventListener('click',()=>{
 const enabled=desktopToggle.getAttribute('aria-pressed')!=='true';
 desktopToggle.setAttribute('aria-pressed',enabled?'true':'false');
 desktopToggle.textContent=enabled?'Canvas desktop: ligado':'Canvas desktop: desligado';
 try{localStorage.setItem('nyra_desktop_canvas',enabled?'1':'0')}catch(_){}
 applyEditorZoom(zoomRange.value);
});
document.getElementById('zoomControls').appendChild(desktopToggle);
zoomRange.addEventListener('input',()=>applyEditorZoom(zoomRange.value));
document.getElementById('nyraZoomOut').addEventListener('click',()=>applyEditorZoom(Number(zoomRange.value)-5));
document.getElementById('nyraZoomIn').addEventListener('click',()=>applyEditorZoom(Number(zoomRange.value)+5));
document.getElementById('nyraZoomReset').addEventListener('click',()=>applyEditorZoom(100));
try{applyEditorZoom(Number(localStorage.getItem('nyra_ui_zoom'))||100)}catch(_){applyEditorZoom(100)}

function openEditor(key){
 if(!pages[key])return;
 document.querySelectorAll('[data-app]').forEach(btn=>btn.classList.toggle('active',btn.dataset.app===key));
 Object.entries(editorFrames).forEach(([app,frame])=>frame.style.display=app===key?'block':'none');
 ensureEditor(key).style.display='block';
 message.textContent='Editor atual: '+names[key]+'. As páginas já abertas permanecem carregadas ao alternar.';
 try{localStorage.setItem('nyra_active_editor',key)}catch(_){}
}
document.querySelectorAll('[data-app]').forEach(btn=>btn.addEventListener('click',()=>openEditor(btn.dataset.app)));
window.addEventListener('message',event=>{
 if(event.data&&event.data.type==='NYRA_SAVE_STATE'&&['items','character','animation'].includes(event.data.app)){
  try{localStorage.setItem('nyra_state_'+event.data.app,JSON.stringify(event.data.payload))}
  catch(err){message.textContent='Não foi possível salvar o estado no navegador: '+err.message}
 }
});
let initial='items';
try{const saved=localStorage.getItem('nyra_active_editor');if(saved&&pages[saved])initial=saved}catch(_){}
openEditor(initial);
