name: Nyra Android Cloud Build

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'android/**'
      - 'app/**'
      - 'gradle/**'
      - '*.gradle'
      - '*.gradle.kts'
      - 'gradle.properties'
      - 'settings.gradle*'
      - 'build.gradle*'
      - '.github/workflows/android-build.yml'
  push:
    branches: [main, work/nyra-integrated-offline-loaders]
    paths:
      - 'android/**'
      - 'app/**'
      - 'gradle/**'
      - '*.gradle'
      - '*.gradle.kts'
      - 'gradle.properties'
      - 'settings.gradle*'
      - 'build.gradle*'
      - '.github/workflows/android-build.yml'

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Audit reference editor features
        run: python3 android/scripts/audit_reference.py

      - name: Audit generated editor adapters
        run: node android/scripts/audit_generated_adapters.cjs

      - name: Test mathematical model DSL
        run: node android/scripts/audit_model_dsl.cjs

      - name: Test Blockbench model importer
        run: node android/scripts/audit_bbmodel_import.cjs

      - name: Test GLB structural preflight
        run: node android/scripts/audit_glb_preflight.cjs

      - name: Locate Gradle wrapper
        id: project
        shell: bash
        run: |
          if [[ -f ./gradlew ]]; then
            echo "project_dir=." >> "$GITHUB_OUTPUT"
          elif [[ -f ./android/gradlew ]]; then
            echo "project_dir=android" >> "$GITHUB_OUTPUT"
          else
            echo "project_dir=missing" >> "$GITHUB_OUTPUT"
          fi

      - name: Build debug APK
        if: steps.project.outputs.project_dir != 'missing'
        shell: bash
        run: |
          cd "${{ steps.project.outputs.project_dir }}"
          chmod +x ./gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Verify offline assets inside APK
        if: success() && steps.project.outputs.project_dir != 'missing'
        run: |
          APK_PATH="${{ steps.project.outputs.project_dir }}/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK_PATH"
          python3 android/scripts/audit_apk.py "$APK_PATH"

      - name: Explain missing Android project
        if: steps.project.outputs.project_dir == 'missing'
        run: |
          echo "::error::The repository has no Android Gradle project yet. Add gradlew, gradle/wrapper, settings.gradle and the app module before building."
          exit 1

      - name: Collect APK
        if: success() && steps.project.outputs.project_dir != 'missing'
        shell: bash
        run: |
          set -euo pipefail
          APK_PATH="${{ steps.project.outputs.project_dir }}/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK_PATH"
          mkdir -p build-output
          cp "$APK_PATH" build-output/nyra-android-debug.apk
          test -s build-output/nyra-android-debug.apk
          sha256sum build-output/nyra-android-debug.apk | tee build-output/SHA256SUMS.txt

      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: nyra-android-debug-apk
          path: build-output/*.apk
          if-no-files-found: error
          retention-days: 14
