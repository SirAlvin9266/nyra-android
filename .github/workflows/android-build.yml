name: Nyra Android Cloud Build

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'app/**'
      - 'gradle/**'
      - '*.gradle'
      - '*.gradle.kts'
      - 'gradle.properties'
      - 'settings.gradle*'
      - 'build.gradle*'
      - '.github/workflows/android-build.yml'

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Audit reference editor features
        run: python3 android/scripts/audit_reference.py

      - name: Audit generated editor adapters
        run: node android/scripts/audit_generated_adapters.cjs

      - name: Locate Gradle wrapper
        id: project
        shell: bash
        run: |
          if [[ -f ./gradlew ]]; then
            echo "project_dir=." >> "$GITHUB_OUTPUT"
          elif [[ -f ./android/gradlew ]]; then
            echo "project_dir=android" >> "$GITHUB_OUTPUT"
          else
            echo "project_dir=missing" >> "$GITHUB_OUTPUT"
          fi

      - name: Build debug APK
        if: steps.project.outputs.project_dir != 'missing'
        shell: bash
        run: |
          cd "${{ steps.project.outputs.project_dir }}"
          chmod +x ./gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Verify offline assets inside APK
        if: success() && steps.project.outputs.project_dir != 'missing'
        run: |
          python3 android/scripts/audit_apk.py android/app/build/outputs/apk/debug/app-debug.apk

      - name: Explain missing Android project
        if: steps.project.outputs.project_dir == 'missing'
        run: |
          echo "::error::The repository has no Android Gradle project yet. Add gradlew, gradle/wrapper, settings.gradle and the app module before building."
          exit 1

      - name: Collect APK
        if: success()
        shell: bash
        run: |
          mkdir -p build-output
          find . -type f -path '*/build/outputs/apk/*/*.apk' -exec cp {} build-output/ \;
          test "$(find build-output -type f -name '*.apk' | wc -l)" -gt 0

      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: nyra-android-debug-apk
          path: build-output/*.apk
          if-no-files-found: error
          retention-days: 14
